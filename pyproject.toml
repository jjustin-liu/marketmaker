[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11"]
build-backend = "setuptools.build_meta"

[project]
name = "marketmaker"
version = "0.1.0"
description = "Binance BTCUSDT market making system"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "joblib>=1.3",
    "redis>=5.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "pyarrow>=14.0",
    "pybind11>=2.11",
    "prometheus-client>=0.19",
    "python-binance>=1.0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "flake8>=6.1",
    "mypy>=1.7",
    "black>=23.11",
    "types-redis",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
